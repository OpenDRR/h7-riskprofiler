name: Sync with H7

permissions:
  contents: write

on:
  #push:
  #  branches: [gh-workflows]

  # "Scheduled workflows run on the latest commit on the default or base branch."
  schedule:
    - cron: '8 0 * * *'

  # "To trigger the workflow_dispatch event, your workflow must be in the default branch."
  # To run this manually from the command-line:
  #   gh workflow run sync.yml --repo OpenDRR/h7-riskprofiler
  workflow_dispatch:

jobs:
  sync-with-h7:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger OpenDRR/h7-framework sync.yml workflow
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -x
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo 'WARNING: `GH_PAT` is not configured; skipping OpenDRR/h7-framework sync.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          TRIGGERED_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          GH_LOGIN=$(gh api user --jq .login)
          if ! gh api --method POST repos/OpenDRR/h7-framework/actions/workflows/sync.yml/dispatches -f ref=gh-workflows; then
            echo 'WARNING: Unable to trigger OpenDRR/h7-framework sync; continuing with the local sync.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          sleep 10
          LOOKUP_STARTED_AT=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          RUN_ID=$(
            gh api --method GET repos/OpenDRR/h7-framework/actions/workflows/sync.yml/runs -f branch=gh-workflows -f event=workflow_dispatch -f per_page=100 --jq '.workflow_runs[] | [.created_at, .id, .actor.login] | @tsv' |
              awk -v triggered_at="$TRIGGERED_AT" -v lookup_started_at="$LOOKUP_STARTED_AT" -v actor="$GH_LOGIN" '$3 == actor && $1 >= triggered_at && $1 <= lookup_started_at {print $1 "\t" $2}' |
              sort |
              head -n 1 |
              cut -f 2
          )
          if [[ -z "${RUN_ID:-}" ]]; then
            echo 'WARNING: Unable to determine the triggered OpenDRR/h7-framework sync run id; continuing with the local sync.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if ! gh run watch --repo OpenDRR/h7-framework --exit-status "$RUN_ID"; then
            RUN_STATUS=$(gh run view --repo OpenDRR/h7-framework "$RUN_ID" --json status --template '{{.status}}' 2>/dev/null || true)
            RUN_CONCLUSION=$(gh run view --repo OpenDRR/h7-framework "$RUN_ID" --json conclusion --template '{{.conclusion}}' 2>/dev/null || true)
            if [[ "$RUN_STATUS" == "completed" && -n "$RUN_CONCLUSION" && "$RUN_CONCLUSION" != "success" ]]; then
              exit 1
            fi
            echo 'WARNING: Unable to watch OpenDRR/h7-framework sync; continuing with the local sync.' | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: "Checkout our own repo: OpenDRR/h7-riskprofiler"
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Fetch and merge latest commits from upstream, and push to GitHub
        run: |
          set -euxo pipefail

          git config checkout.defaultRemote origin
          git config user.name github-actions
          git config user.email github-actions@github.com

          git remote add upstream ${{ secrets.UPSTREAM_GIT_REPO }}
          git fetch upstream --tags

          LAST_SYNC_UPSTREAM_REF=$(git tag -l --format='%(contents)' last-sync-upstream-ref | head -1)
          if [[ -z $LAST_SYNC_UPSTREAM_REF ]]; then
            echo 'ERROR: `last-sync-upstream-ref` tag not found. Please create it manually.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          UPSTREAM_BRANCH=upstream/main
          #UPSTREAM_BRANCH=upstream/fw-v2
          LATEST_UPSTREAM_REV=$(git rev-parse --verify $UPSTREAM_BRANCH)
          if [[ "$LAST_SYNC_UPSTREAM_REF" == "$LATEST_UPSTREAM_REV" ]]; then
            echo 'INFO: No change since last sync, skipping.' | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git cherry-pick "$LAST_SYNC_UPSTREAM_REF"..$UPSTREAM_BRANCH |& tee -a "$GITHUB_STEP_SUMMARY"
          git tag -a -f -m "$LATEST_UPSTREAM_REV" last-sync-upstream-ref

          git push origin --all
          git push origin -f last-sync-upstream-ref
          git push origin --tags
